<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Decision SDK - build your own Jev-style decision model</title>
  <desc id="description">A language model flows through a trainable decision readout into calibrated candidate choices.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1023"/>
      <stop offset=".52" stop-color="#111d35"/>
      <stop offset="1" stop-color="#072a32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#41dfbb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#42dcb3" stop-opacity=".21"/>
      <stop offset="1" stop-color="#42dcb3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d1e1f7" stroke-opacity=".075"/>
    </pattern>
    <filter id="card-shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000b1d" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#background)"/>
  <rect width="1200" height="430" rx="26" fill="url(#grid)"/>
  <circle cx="1010" cy="175" r="335" fill="url(#glow)"/>
  <path d="M32 0h1136a32 32 0 0 1 32 32v366a32 32 0 0 1-32 32H32A32 32 0 0 1 0 398V32A32 32 0 0 1 32 0Z" fill="none" stroke="#9fc4d8" stroke-opacity=".22"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="66" y="54" width="147" height="30" rx="15" fill="#5a6dd9" fill-opacity=".23" stroke="#8298ff" stroke-opacity=".48"/>
    <text x="84" y="74" fill="#b6c3ff" font-size="13" font-weight="700" letter-spacing="1.5">FUTURIXAI / SDK</text>
    <text x="66" y="158" fill="#f4f8ff" font-size="55" font-weight="750" letter-spacing="-2">Build your own</text>
    <text x="66" y="223" fill="url(#accent)" font-size="58" font-weight="780" letter-spacing="-2">decision model.</text>
    <text x="68" y="268" fill="#bfd0e3" font-size="20">Turn a compatible LLM into a Jev-style model,</text>
    <text x="68" y="298" fill="#bfd0e3" font-size="20">or fine-tune a decision model that already exists.</text>

    <rect x="66" y="341" width="320" height="43" rx="21" fill="#f4f8ff" fill-opacity=".09" stroke="#d4e8ff" stroke-opacity=".23"/>
    <circle cx="90" cy="362" r="5" fill="#4be0b9"/>
    <text x="106" y="368" fill="#e4f2fb" font-size="15" font-weight="650" letter-spacing=".6">TRAIN  /  FINE-TUNE  /  INFER</text>
  </g>

  <g filter="url(#card-shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="680" y="70" width="173" height="118" rx="17" fill="#1b2943" stroke="#91a2ff" stroke-opacity=".55"/>
    <rect x="698" y="89" width="40" height="5" rx="2.5" fill="#8b9bff"/>
    <rect x="698" y="103" width="109" height="5" rx="2.5" fill="#a9bbda" fill-opacity=".55"/>
    <rect x="698" y="117" width="78" height="5" rx="2.5" fill="#a9bbda" fill-opacity=".4"/>
    <text x="698" y="162" fill="#f0f4ff" font-size="17" font-weight="700">Language model</text>

    <rect x="916" y="70" width="218" height="118" rx="17" fill="#193747" stroke="#51ddbd" stroke-opacity=".65"/>
    <circle cx="942" cy="106" r="9" fill="#49dbb7"/>
    <circle cx="982" cy="106" r="9" fill="#9b9ffb"/>
    <circle cx="1022" cy="106" r="9" fill="#83bcf3"/>
    <path d="M951 106h22m18 0h22" stroke="#a0c6d7" stroke-opacity=".7" stroke-width="2"/>
    <text x="935" y="162" fill="#f0faff" font-size="17" font-weight="700">Decision readout</text>

    <rect x="778" y="242" width="356" height="133" rx="17" fill="#1c3444" stroke="#88d8d0" stroke-opacity=".55"/>
    <text x="800" y="271" fill="#c4d9e9" font-size="14" font-weight="650" letter-spacing="1">RUNTIME CHOICES</text>
    <rect x="800" y="288" width="311" height="29" rx="8" fill="#48d9b4" fill-opacity=".2" stroke="#57e5be" stroke-opacity=".65"/>
    <text x="813" y="308" fill="#e3fff5" font-size="14" font-weight="650">billing</text>
    <rect x="982" y="296" width="116" height="12" rx="6" fill="#4ce1ba"/>
    <rect x="800" y="327" width="311" height="29" rx="8" fill="#7991ba" fill-opacity=".13"/>
    <text x="813" y="347" fill="#bfd2e2" font-size="14">technical</text>
    <rect x="982" y="335" width="45" height="12" rx="6" fill="#819cbb"/>
  </g>
  <path d="M853 129h51" stroke="#a1d9d8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="m897 122 8 7-8 7" fill="none" stroke="#a1d9d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1025 188v38H955v15" fill="none" stroke="#a1d9d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m948 234 7 8 7-8" fill="none" stroke="#a1d9d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
