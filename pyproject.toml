[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "futurix-decision"
version = "0.1.0"
description = "Open-source SDK for calibrated, runtime-defined decisions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.57,<6",
  "pydantic>=2,<3",
  "huggingface-hub>=0.26",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
datasets = ["datasets>=3,<5"]
train = ["accelerate>=1,<2", "peft>=0.20,<1", "safetensors>=0.4"]
bosun = ["transformers>=4.57,<5", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
decider = ["transformers>=5.17,<6", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
decider-vllm = ["transformers>=5.17,<6", "vllm>=0.29,<1"]
jpt = ["transformers>=5.17,<6", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
jpt-vllm = ["transformers>=5.17,<6", "vllm>=0.29,<1"]
eikos = ["transformers>=5.12,<6", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
eikos-vllm = ["transformers>=5.12,<6", "vllm>=0.30,<1"]
native-http = ["httpx>=0.28,<1"]
laya = ["laya>=0.4.2,<1"]
gliner = ["gliner2[local]"]
gliner-train = ["gliner2[train]"]
kev-native = ["transformers>=5.17,<6", "peft>=0.21,<1", "datasets>=3,<5"]
clef = ["transformers>=5.10.2,<6", "accelerate>=1,<2", "safetensors>=0.4", "torchvision", "pillow"]
pplx-decider = ["transformers>=5.17,<6", "safetensors>=0.4"]
nox-lux = ["transformers>=5.17,<6", "safetensors>=0.4"]
liquid-d1 = ["transformers>=5.14,<6", "torchvision", "pillow"]
"qwen3.5" = ["transformers>=5.17,<6", "accelerate>=1,<2", "peft>=0.21,<1"]
qlora = ["accelerate>=1,<2", "peft>=0.20,<1", "bitsandbytes>=0.45", "safetensors>=0.4"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
vllm = ["vllm>=0.20,<1"]
wandb = ["wandb>=0.19,<1"]
dev = [
  "pytest>=8,<10",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "peft>=0.20,<1",
  "safetensors>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/futurix_decision"]

[project.scripts]
futurix-decision = "futurix_decision.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
