[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "futurix-decision"
dynamic = ["version"]
description = "Open-source SDK for calibrated, runtime-defined decisions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "huggingface-hub>=0.26",
]

# Local models, training, and serving need torch. The core (schemas, dataset
# loading, metrics, HTTP runtimes) does not.
[project.optional-dependencies]
torch = ["torch>=2.4", "transformers>=5.17,<6"]
datasets = ["datasets>=3,<5"]
train = ["futurix-decision[torch]", "accelerate>=1,<2", "peft>=0.20,<1", "safetensors>=0.4"]
bosun = ["futurix-decision[torch]", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
decider = ["futurix-decision[torch]", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
decider-vllm = ["futurix-decision[torch]", "vllm>=0.30,<1"]
jpt = ["futurix-decision[torch]", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
jpt-vllm = ["futurix-decision[torch]", "vllm>=0.30,<1"]
eikos = ["futurix-decision[torch]", "accelerate>=1,<2", "peft>=0.21,<1", "safetensors>=0.4"]
eikos-vllm = ["futurix-decision[torch]", "vllm>=0.30,<1"]
laya = ["futurix-decision[torch]", "laya>=0.4.2,<1"]
gliner = ["futurix-decision[torch]", "gliner2[local]>=2.1,<3"]
gliner-train = ["futurix-decision[torch]", "gliner2[train]>=2.1,<3"]
kev-native = ["futurix-decision[torch]", "peft>=0.21,<1", "datasets>=3,<5"]
clef = [
  "futurix-decision[torch]",
  "accelerate>=1,<2",
  "safetensors>=0.4",
  "torchvision>=0.28,<1",
  "pillow",
]
pplx-decider = ["futurix-decision[torch]", "safetensors>=0.4"]
nox-lux = ["futurix-decision[torch]", "safetensors>=0.4"]
liquid-d1 = ["futurix-decision[torch]", "torchvision>=0.28,<1", "pillow"]
"qwen3.5" = ["futurix-decision[torch]", "accelerate>=1,<2", "peft>=0.21,<1"]
qlora = [
  "futurix-decision[torch]",
  "accelerate>=1,<2",
  "peft>=0.20,<1",
  "bitsandbytes>=0.45",
  "safetensors>=0.4",
]
serve = ["futurix-decision[torch]", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
vllm = ["futurix-decision[torch]", "vllm>=0.30,<1"]
wandb = ["wandb>=0.19,<1"]
dev = [
  "futurix-decision[torch]",
  "pytest>=8,<10",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "peft>=0.20,<1",
  "safetensors>=0.4",
  "fastapi>=0.115,<1",
  "ruff>=0.17,<0.18",
  "mypy>=2,<3",
  "types-PyYAML>=6",
]

[tool.hatch.version]
path = "src/futurix_decision/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/futurix_decision"]

[project.scripts]
futurix-decision = "futurix_decision.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
# B905 (zip without strict=) is fixed in Phase 7 of docs/plans/sdk-0.2.md.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# __version__ is set before the imports so submodules can read it mid-import.
"src/futurix_decision/__init__.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["futurix_decision"]

[tool.mypy]
python_version = "3.10"
files = ["src/futurix_decision"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "futurix_decision.inference.*",
  "futurix_decision.datasets.schema",
  "futurix_decision.client.*",
  "futurix_decision.errors",
  "futurix_decision.models.calibrated",
  "futurix_decision.models.families.*",
  "futurix_decision.models.protocol",
  "futurix_decision.models.registry",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "accelerate.*",
  "autojev.*",
  "datasets.*",
  "gliner2.*",
  "kev.*",
  "laya.*",
  "vllm.*",
  "wandb.*",
]
ignore_missing_imports = true

# Baseline: errors that existed when mypy was introduced. Remove codes from
# these lists as the modules are fixed; new modules get the full default set.
[[tool.mypy.overrides]]
module = "futurix_decision.cli"
disable_error_code = ["abstract", "arg-type", "assignment", "attr-defined", "union-attr"]

[[tool.mypy.overrides]]
module = "futurix_decision.datasets.benchmarks"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "futurix_decision.evaluation.evaluator"
disable_error_code = ["arg-type", "assignment", "var-annotated"]

[[tool.mypy.overrides]]
module = [
  "futurix_decision.models.decider",
  "futurix_decision.models.eikos",
  "futurix_decision.models.jpt",
  "futurix_decision.models.letter_code",
]
disable_error_code = ["arg-type", "assignment", "operator"]

[[tool.mypy.overrides]]
module = ["futurix_decision.models.native", "futurix_decision.models.sources"]
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "futurix_decision.trainers.*"
disable_error_code = ["arg-type", "assignment", "attr-defined", "operator", "override", "union-attr"]

[[tool.mypy.overrides]]
module = "futurix_decision.vllm.*"
disable_error_code = ["arg-type", "misc", "var-annotated"]
