model:
  name: ./decision-calibrated
dataset: SargeDev/jev-distill-corpus-v3
output: ./decision-rlcd
training:
  rlcd:
    enabled: true
    method: full
    epochs: 1
    batch_size: 8
    learning_rate: 0.00001
    precision: bf16
    group_size: 8
    noise_sigma: 0.25
    sft_weight: 0.2
    kl_beta: 0.01
rewards:
  log: 1.0
  spherical: 0.5
  ranked: 1.0
